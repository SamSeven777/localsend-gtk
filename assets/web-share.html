<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalSend · Download</title>
<style>
:root{color-scheme:light dark;font:16px system-ui,sans-serif;background:#f6faf8;color:#163b35}body{margin:0;padding:40px 20px}main{max-width:780px;margin:auto;text-align:center}h1{font-size:32px;letter-spacing:-1px}p{line-height:1.6}.hint{font-size:14px;color:#526862}#files{display:grid;grid-template-columns:1fr;gap:12px;margin:28px 0;text-align:left}.file{display:flex;align-items:center;gap:14px;padding:20px;border-radius:16px;background:#00796b;color:white;text-decoration:none}.file:hover{background:#009688}.name{flex:1;overflow-wrap:anywhere}.size,.index{font-size:13px;opacity:.85}button{font:600 15px system-ui;border:0;border-radius:24px;padding:14px 24px;background:#00796b;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:wait}#disconnect{background:transparent;color:inherit}[hidden]{display:none!important}@media(min-width:700px){#files.multiple{grid-template-columns:1fr 1fr}}@media(prefers-color-scheme:dark){:root{background:#10211e;color:#dcebe5}.hint{color:#a8c0b6}.file,button{background:#245b49;color:#dcebe5}.file:hover{background:#327a61}}
</style>
<main><h1>LocalSend</h1><p id="status" role="status" aria-live="polite">Waiting for the sender to approve…</p><div id="files"></div><button id="all" hidden>Download all</button><button id="retry" hidden>Request access again</button><button id="disconnect">Cancel</button><p class="hint">Choose a file to download. Your browser may ask where to save it.<br>Keep this page open until downloads finish.</p><p class="hint">This temporary HTTP link is unencrypted. Use a trusted local network.</p><noscript>Enable JavaScript to request these files.</noscript></main>
<script>
'use strict';
const status=document.getElementById('status'), list=document.getElementById('files'), all=document.getElementById('all'), retry=document.getElementById('retry'), disconnect=document.getElementById('disconnect');
const base=location.pathname;let requestId=null, controller=null, links=[], generation=0;
function formatBytes(bytes){if(bytes<1024)return bytes+' B';if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';if(bytes<1073741824)return(bytes/1048576).toFixed(1)+' MB';return(bytes/1073741824).toFixed(1)+' GB';}
function withdraw(){if(requestId)fetch(base+'withdraw/'+requestId,{method:'POST',keepalive:true}).catch(()=>{});}
function clearFiles(){list.replaceChildren();links=[];all.hidden=true;}
function errorMessage(code){return({403:'The sender declined the request or approval timed out.',404:'This link has expired. Ask the sender for a new link.',410:'Sharing has stopped. Ask the sender for a new link.',429:'The sender has too many requests. Please try again shortly.'})[code]||'Could not connect to the sender. Check your connection and try again.';}
async function request(){const current=++generation;withdraw();if(controller)controller.abort();clearFiles();retry.hidden=true;disconnect.hidden=false;disconnect.textContent='Cancel';status.textContent='Waiting for the sender to approve…';controller=new AbortController();requestId=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
try{const response=await fetch(base+'prepare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId}),signal:controller.signal});if(current!==generation)return;if(!response.ok)throw Error(errorMessage(response.status));const manifest=await response.json();if(current!==generation)return;status.textContent='Files ('+manifest.files.length+')';list.classList.toggle('multiple',manifest.files.length>1);manifest.files.forEach((file,index)=>{const link=document.createElement('a');link.className='file';link.href=base+'file/'+encodeURIComponent(manifest.session)+'/'+encodeURIComponent(file.id);link.download=file.name.split(/[\\/]/).pop()||'download';const number=document.createElement('span');number.className='index';number.textContent=String(index+1);const name=document.createElement('span');name.className='name';name.textContent=file.name;const size=document.createElement('span');size.className='size';size.textContent=formatBytes(file.size);link.append(number,name,size);list.append(link);links.push(link);});all.hidden=links.length<2;disconnect.textContent='Disconnect';}
catch(error){if(current!==generation)return;status.textContent=error.name==='AbortError'?'Request cancelled.':error.message;retry.hidden=false;disconnect.hidden=true;withdraw();requestId=null;}
}
all.onclick=async()=>{const current=generation;all.disabled=true;status.textContent='Starting downloads… Your browser may ask to allow multiple files.';for(const link of links){if(current!==generation)break;link.click();await new Promise(resolve=>setTimeout(resolve,300));}if(current===generation){all.disabled=false;status.textContent='Downloads started. Check your browser’s download list for progress.';}};
disconnect.onclick=()=>{++generation;withdraw();if(controller)controller.abort();controller=null;requestId=null;clearFiles();all.disabled=false;disconnect.hidden=true;retry.hidden=false;status.textContent='Disconnected. Active downloads have been cancelled.';};
retry.onclick=request;window.addEventListener('pagehide',()=>{if(requestId)navigator.sendBeacon(base+'withdraw/'+requestId);});request();
</script></html>
